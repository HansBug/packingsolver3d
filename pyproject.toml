[build-system]
requires = [
    "setuptools>=42",
    "wheel",
    "pybind11>=2.10",
    "cmake>=3.28",
]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
# Free-threaded 3.13/3.14 wheels are not built: pybind11 supports them, but the test matrix does not cover them.
skip = ["pp*", "cp31?t-*"] # Do not build for PyPy or free-threaded CPython
build-verbosity = 1
before-test = [
    "python -m pip install -r {project}/requirements-test.txt",
]
# Run from a scratch directory so the installed wheel, not the source tree, is what gets imported.
test-command = [
    "cp -rf {project}/test test",
    "cp {project}/pytest.ini pytest.ini",
    "pytest test -sv -m unittest",
    "rm -rf test",
]

## Linux build configuration
[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

## macOS build configuration
[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

## Windows build configuration
[tool.cibuildwheel.windows]
archs = ["AMD64", "ARM64"]
