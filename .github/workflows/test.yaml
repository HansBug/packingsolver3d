name: Code Test

on:
  push:
  workflow_dispatch:

jobs:
  unittest:
    name: Code test
    runs-on: ${{ matrix.os }}
    if: "!contains(github.event.head_commit.message, 'ci skip')"
    strategy:
      fail-fast: false
      matrix:
        os:
          - 'ubuntu-22.04'
          - 'windows-2022'
          - 'macos-14'
        python-version:
          - '3.7'
          - '3.8'
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
        exclude:
          # The public macOS arm64 runner does not have usable setup-python installers for these EOL versions.
          - os: 'macos-14'
            python-version: '3.7'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 20
          submodules: 'recursive'
      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up GNU make on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          choco install make
      - name: Record the upstream revision
        id: upstream
        shell: bash
        run: |
          echo "sha=$(git -C upstream/packingsolver rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Upstream plus its FetchContent dependencies take most of the job; the
      # CMake tree is keyed by everything that can change what it contains.
      - name: Cache the CMake build tree
        uses: actions/cache@v4
        with:
          path: build/cmake
          key: cmake-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}-${{ steps.upstream.outputs.sha }}-${{ hashFiles('CMakeLists.txt', 'setup.py', 'packingsolver3d/_core.cpp') }}
          restore-keys: |
            cmake-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}-${{ steps.upstream.outputs.sha }}-
      - name: Set up build tools
        shell: bash
        run: |
          python -m pip install -U pip
          pip install -r requirements-build.txt
          cmake --version
      # On Linux the bridge is gcov-instrumented and `make unittest` folds its
      # C++ coverage into coverage.xml next to the Python coverage; the wheels
      # are never built this way.
      - name: Build the extension
        env:
          LINETRACE: ${{ runner.os == 'Linux' && '1' || '' }}
        shell: bash
        run: |
          make build
          ls -al packingsolver3d
      - name: Prepare Python env
        shell: bash
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      - name: Run unittest
        env:
          CI: 'true'
        shell: bash
        run: |
          make unittest
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Wheel smoke on every platform; the full Python x architecture breadth lives in Release Test.
  test_wheel_build:
    name: Try Build
    runs-on: ${{ matrix.os }}
    if: "!contains(github.event.head_commit.message, 'ci skip')"
    env:
      CIBW_CACHE_PATH: ./.cibw-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 'ubuntu-22.04'
            python: '3.7'  # exercises the last cibuildwheel line that still targets cp37
            architecture: 'x86_64'
          - os: 'ubuntu-22.04'
            python: '3.12'
            architecture: 'x86_64'
          - os: 'windows-2022'
            python: '3.12'
            architecture: 'AMD64'
          - os: 'macos-14'
            python: '3.12'
            architecture: 'arm64'
          - os: 'macos-15-intel'
            python: '3.12'
            architecture: 'x86_64'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 20
          submodules: 'recursive'
      - name: Set up QEMU
        if: ${{ runner.os == 'Linux' }}
        uses: docker/setup-qemu-action@v3
      - name: Set up python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Verify macOS arch
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          [ "$(uname -m)" = "${{ matrix.architecture }}" ]
      - name: Prime cibuildwheel cache
        if: ${{ runner.os == 'Windows' || runner.os == 'macOS' }}
        shell: bash
        run: |
          case "${{ matrix.python }}" in
            3.7) VIRTUALENV_VERSION=20.21.1 ;;
            *) VIRTUALENV_VERSION=20.30.0 ;;
          esac
          mkdir -p "$CIBW_CACHE_PATH"
          TARGET="$CIBW_CACHE_PATH/virtualenv-${VIRTUALENV_VERSION}.pyz"
          URL="https://raw.githubusercontent.com/pypa/get-virtualenv/${VIRTUALENV_VERSION}/public/virtualenv.pyz"
          if [ ! -f "$TARGET" ]; then
            curl -fL --retry 8 --retry-all-errors --retry-delay 5 -o "$TARGET" "$URL"
          fi
          ls -al "$CIBW_CACHE_PATH"
      - name: Build wheels
        env:
          CIBW_SKIP: "pp* cp31?t-*"
          CIBW_ARCHS: ${{ matrix.architecture }}
          CIBW_PROJECT_REQUIRES_PYTHON: ~=${{ matrix.python }}.0
        shell: bash
        run: |
          python -m pip install -U pip
          pip install cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse
      - name: Show the buildings
        shell: bash
        run: |
          ls -al ./wheelhouse
          mv wheelhouse dist
      - name: Upload packed files to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ runner.os }}-cp${{ matrix.python }}-${{ matrix.architecture }}
          path: ./dist/*
