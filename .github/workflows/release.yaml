name: Release

on:
  release:
    types: [ published ]

jobs:
  # PyPI publishing should stay in a normal workflow job instead of a reusable workflow.
  wheel_build:
    name: Build wheel
    runs-on: ${{ matrix.os }}
    env:
      CIBW_CACHE_PATH: ./.cibw-cache
    strategy:
      fail-fast: false
      matrix:
        # Every runner builds the wheel of its own architecture natively; the
        # `include` entries only attach the cibuildwheel architecture name and
        # the `uname -m` spelling to each runner.  Everything else (i686, ppc64le,
        # s390x, armv7l, riscv64, loongarch64, wasm32) is served by the sdist.
        os:
          - 'ubuntu-22.04'      # Linux x86_64
          - 'ubuntu-22.04-arm'  # Linux aarch64, public arm64 runner
          - 'windows-2022'      # Windows AMD64
          - 'windows-11-arm'    # Windows ARM64, public arm64 runner
          - 'macos-14'          # macOS arm64, public arm64 runner
          - 'macos-15-intel'    # macOS x86_64, public Intel runner
        python:
          - '3.7'
          - '3.8'
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
        include:
          - os: 'ubuntu-22.04'
            arch: x86_64
            uname: x86_64
          - os: 'ubuntu-22.04-arm'
            arch: aarch64
            uname: aarch64
          - os: 'windows-2022'
            arch: AMD64
            uname: ''
          - os: 'windows-11-arm'
            arch: ARM64
            uname: ''
          - os: 'macos-14'
            arch: arm64
            uname: arm64
          - os: 'macos-15-intel'
            arch: x86_64
            uname: x86_64
        exclude:
          # actions/setup-python has no Linux arm64 or macOS build of 3.7 (EOL since 2023-06).
          - os: 'ubuntu-22.04-arm'
            python: '3.7'
          - os: 'macos-14'
            python: '3.7'
          - os: 'macos-15-intel'
            python: '3.7'
          # CPython ships Windows ARM64 builds from 3.11 on.
          - os: 'windows-11-arm'
            python: '3.7'
          - os: 'windows-11-arm'
            python: '3.8'
          - os: 'windows-11-arm'
            python: '3.9'
          - os: 'windows-11-arm'
            python: '3.10'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 20
          submodules: 'recursive'
      - name: Check the runner architecture
        if: ${{ matrix.uname != '' }}
        shell: bash
        run: |
          uname -m
          [ "$(uname -m)" = "${{ matrix.uname }}" ] || { echo "The runner is not ${{ matrix.uname }}."; exit 1; }
      - name: Set up python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Prime cibuildwheel cache
        if: ${{ runner.os == 'Windows' || runner.os == 'macOS' }}
        shell: bash
        run: |
          case "${{ matrix.python }}" in
            3.7) VIRTUALENV_VERSION=20.21.1 ;;
            *) VIRTUALENV_VERSION=20.30.0 ;;
          esac
          mkdir -p "$CIBW_CACHE_PATH"
          TARGET="$CIBW_CACHE_PATH/virtualenv-${VIRTUALENV_VERSION}.pyz"
          URL="https://raw.githubusercontent.com/pypa/get-virtualenv/${VIRTUALENV_VERSION}/public/virtualenv.pyz"
          if [ ! -f "$TARGET" ]; then
            curl -fL --retry 8 --retry-all-errors --retry-delay 5 -o "$TARGET" "$URL"
          fi
          ls -al "$CIBW_CACHE_PATH"
      - name: Build wheels
        env:
          CIBW_SKIP: "pp* cp31?t-*"
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_PROJECT_REQUIRES_PYTHON: ~=${{ matrix.python }}.0
        shell: bash
        run: |
          python -m pip install -U pip
          pip install cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse
      - name: Show the buildings
        shell: bash
        run: |
          ls -al ./wheelhouse
          mv wheelhouse dist
      - name: Upload packed files to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ runner.os }}-cp${{ matrix.python }}-${{ matrix.arch }}
          path: ./dist/*

  sdist_build:
    name: Build sdist
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 20
          submodules: 'recursive'
      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build sdist
        shell: bash
        run: |
          python -m pip install -U pip build twine
          PACKINGSOLVER3D_SKIP_NATIVE_BUILD=1 python -m build --sdist --outdir dist
          twine check dist/*
      - name: Upload sdist to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-sdist
          path: ./dist/*

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-22.04
    needs:
      - wheel_build
      - sdist_build
    permissions:
      contents: write

    steps:
      - name: Download packed files to artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-artifacts-*
          path: ./dist
          merge-multiple: true
      - name: Show the buildings
        shell: bash
        run: |
          ls -al ./dist
      - name: Publish distribution to real PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_PASSWORD }}
          verbose: true
          skip-existing: true
          packages-dir: dist/
      - name: Upload distribution to GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
